[package]
name = "atlas-dump-core"
version = "0.1.0"
edition = "2021"
description = "Windows memory dump parsing library for Atlas"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
minidump = "0.23"
minidump-common = "0.23"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
